; Ambiente principal: firmware completo
[env:waveshare-esp32-s3-amoled]
; Plataforma customizada mantida pelo pioarduino (core Arduino 3.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Flash / PSRAM / Particionamento
; flash_mode = qio é coerente com memory_type = qio_opi (flash QIO + PSRAM OPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

; Compilação
build_unflags = -Os -O2
build_flags =
    -O3
    -funroll-loops
    -fomit-frame-pointer
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DXPOWERS_CHIP_AXP2101
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I include/core
    -I include/drivers
    -I include/web
    -DCONFIG_ZLIB_SUPPORT
    -DDISABLE_ALL_LIBRARY_WARNINGS

extra_scripts = pre:scripts/fix_lvgl_helium.py

; Dependências
; A maior parte das libs é vendorizada em lib/ (lvgl, ArduinoJson, Arduino_GFX,
; ESP32_IO_Expander, SensorLib, es8311). As abaixo NÃO estavam vendorizadas e
; são necessárias para o firmware completo (PMU, WebUI/Portal). São baixadas
; automaticamente no primeiro build (requer internet uma única vez) e depois
; ficam em cache. Versões fixadas para builds reprodutíveis.
;   O touch FT3168 agora usa um driver interno próprio (include/drivers/TouchFT3168.h),
;   então NÃO dependemos mais de TouchLib.
lib_deps =
    lewisxhe/XPowersLib @ ^0.2.7
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.2.0
    ; >=1.6.1: introduz a classe Arduino_OLED com setBrightness() usada no firmware.
    moononournation/GFX Library for Arduino @ ^1.6.1
    lvgl/lvgl @ 9.2.2

; Upload
upload_protocol = esptool
upload_speed = 921600

; src/legacy/ foi movido para _quarantine/ (código morto). build_src_filter
; padrão do PIO (+<*>) já é suficiente.
build_src_filter = +<*>

; --------------------------------------------------------------------------
; Ambiente de smoke test: LVGL mínimo (lvgl_smoke_test.cpp)
; --------------------------------------------------------------------------
[env:waveshare-esp32-s3-amoled-smoke]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Reaproveita as mesmas configs de flash/particionamento
; flash_mode = qio é coerente com memory_type = qio_opi (flash QIO + PSRAM OPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

build_unflags = -Os -O2
build_flags =
    -O3
    -funroll-loops
    -fomit-frame-pointer
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DXPOWERS_CHIP_AXP2101
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I include/core
    -I include/drivers
    -I include/web
    -DCONFIG_ZLIB_SUPPORT
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DLVGL_SMOKE_TEST

extra_scripts = pre:scripts/fix_lvgl_helium.py

; O smoke testa apenas o LVGL no hardware: compila só o lvgl_smoke_test.cpp
; (main.cpp precisa de todas as libs do firmware completo).
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.1
    lvgl/lvgl @ 9.2.2

upload_protocol = esptool
upload_speed = 921600

; Compila apenas o teste de fumaça (main.cpp/legacy ficam de fora)
build_src_filter = -<*> +<lvgl_smoke_test.cpp>
; NOTA: src/legacy/ também foi removido (movido para _quarantine/).