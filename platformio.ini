; Ambiente principal: firmware completo
[env:waveshare-esp32-s3-amoled]
; Plataforma customizada mantida pelo pioarduino (core Arduino 3.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Flash / PSRAM / Particionamento
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

; Compilação
build_unflags = -Os -O2
build_flags =
    -O3
    -funroll-loops
    -fomit-frame-pointer
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DXPOWERS_CHIP_AXP2101
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
    -I include
    -I include/core
    -I include/drivers
    -I include/web
    -DCONFIG_ZLIB_SUPPORT
    -DDISABLE_ALL_LIBRARY_WARNINGS

; Dependências
; A maior parte das libs é vendorizada em lib/ (lvgl, ArduinoJson, Arduino_GFX,
; ESP32_IO_Expander, SensorLib, es8311). As abaixo NÃO estavam vendorizadas e
; são necessárias para o firmware completo (PMU, WebUI/Portal). São baixadas
; automaticamente no primeiro build (requer internet uma única vez) e depois
; ficam em cache. Versões fixadas para builds reprodutíveis.
;   O touch FT3168 agora usa um driver interno próprio (include/drivers/TouchFT3168.h),
;   então NÃO dependemos mais de TouchLib.
lib_deps =
    lewisxhe/XPowersLib @ ^0.2.7
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.6.0

; Upload
upload_protocol = esptool
upload_speed = 921600

; Não compilar código legado
build_src_filter = +<*> -<legacy/>

; --------------------------------------------------------------------------
; Ambiente de smoke test: LVGL mínimo (lvgl_smoke_test.cpp)
; --------------------------------------------------------------------------
[env:waveshare-esp32-s3-amoled-smoke]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Reaproveita as mesmas configs de flash/particionamento
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

build_unflags = -Os -O2
build_flags =
    -O3
    -funroll-loops
    -fomit-frame-pointer
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DXPOWERS_CHIP_AXP2101
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
    -I include
    -I include/core
    -I include/drivers
    -I include/web
    -DCONFIG_ZLIB_SUPPORT
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DLVGL_SMOKE_TEST

lib_deps =

upload_protocol = esptool
upload_speed = 921600

; Não compilar código legado (igual ao ambiente principal)
build_src_filter = +<*> -<legacy/>