    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38ff9e"/><stop offset="1" stop-color="#b26bff"/></linearGradient>
  </defs>
  <rect width="820" height="520" fill="#05070c" rx="16"/>
  <text x="24" y="34" font-family="Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6f0ff">Tela no dispositivo — 3 telas deslizáveis (swipe)</text>

